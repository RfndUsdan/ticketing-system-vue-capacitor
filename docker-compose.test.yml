services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apakabar_test
      POSTGRES_USER: apakabar
      POSTGRES_PASSWORD: apakabar_test_password
    ports:
      - "5433:5432"
    volumes:
      - apakabar_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apakabar -d apakabar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apakabar_test_pgdata:
